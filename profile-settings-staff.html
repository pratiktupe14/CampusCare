<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">

<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Profile Settings - CampusCare</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="shared-tailwind-config.js"></script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-elevation { box-shadow: 0px 1px 3px rgba(0,0,0,0.05), 0px 10px 15px -5px rgba(0,0,0,0.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="text-on-surface min-h-screen flex">
    
    <app-sidebar active="profile" role="staff"></app-sidebar>

    <!-- Main Content Area -->
    <main class="flex-1 md:ml-[220px] bg-[#F8FAFC] min-h-screen pb-24 md:pb-8 min-w-0">
        <!-- Top Bar -->
        <header class="h-16 flex justify-between items-center px-6 py-3 sticky top-0 z-40 w-full bg-white border-b border-gray-200 shadow-sm">
            <div class="flex items-center gap-4">
                <button class="md:hidden p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h2 class="text-xl font-bold text-primary">Profile</h2>
            </div>
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors relative">
                    <span class="material-symbols-outlined text-gray-600">notifications</span>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-primary rounded-full border border-white"></span>
                </button>
                <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
                    <span class="material-symbols-outlined text-gray-600">settings</span>
                </button>
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs">AR</div>
            </div>
        </header>

        <!-- Dashboard Body -->
        <div class="p-6 max-w-7xl mx-auto space-y-6">
            
            <h3 class="text-2xl font-bold text-gray-900 mb-2">My Profile</h3>

            <!-- Profile Info Card -->
            <div class="bg-white border border-gray-200 rounded-xl p-6 soft-elevation flex flex-col md:flex-row items-center md:items-start gap-6">
                <div class="w-24 h-24 rounded-full overflow-hidden bg-outline-variant flex-shrink-0 border-4 border-white shadow-sm">
                    <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAD7sL2MBNHL1zGJ-lsss2BDno6GAsbpWMyxI8BfCUK96IJKDlrS8kRz2eVV1UPUICqqpDxCVdDGJoldgUwHMV8wA9vIaB_27AgkbH7GE_UVYdAksSGC5nDciMQmZXS10kkZJKSycsRcuArRmBkC-w4FmIzcQYpY9u5LNJWM8e3FIgwlCYOjgn7_83K4N4pmZXstMed87M_GbHo76H_xDPEohekUZt20a8v9Kh3fwVDL4p1lwTfaQ40UA" alt="Alex Rivera">
                </div>
                <div class="flex-1 text-center md:text-left">
                    <h4 class="text-2xl font-bold text-gray-900">Alex Rivera</h4>
                    <p class="text-sm font-bold text-primary mt-1">Maintenance Staff</p>
                    <p class="text-xs text-gray-500 uppercase tracking-wider mt-1">ID: #ST-99283</p>
                    
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 mt-4">
                        <span class="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-full border border-blue-100">HVAC</span>
                        <span class="px-3 py-1 bg-amber-50 text-amber-700 text-xs font-bold rounded-full border border-amber-100">Electrical</span>
                        <span class="px-3 py-1 bg-teal-50 text-teal-700 text-xs font-bold rounded-full border border-teal-100">Plumbing</span>
                    </div>
                </div>
                <div>
                    <button class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-2 px-4 rounded-lg transition-colors text-sm soft-elevation">
                        Change Photo
                    </button>
                </div>
            </div>

            <!-- Editable Form -->
            <form class="bg-white border border-gray-200 rounded-xl p-6 soft-elevation space-y-6">
                <h4 class="text-lg font-bold text-gray-900 border-b border-gray-100 pb-2">Personal Information</h4>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Full Name</label>
                        <input type="text" value="Alex Rivera" class="w-full bg-white border border-gray-300 rounded-lg py-2.5 px-3 text-gray-900 placeholder-gray-400 focus:ring-1 focus:ring-primary focus:border-primary outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Employee ID</label>
                        <input type="text" value="#ST-99283" disabled class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 text-gray-500 cursor-not-allowed text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
                        <input type="email" value="alex.rivera@university.edu" class="w-full bg-white border border-gray-300 rounded-lg py-2.5 px-3 text-gray-900 placeholder-gray-400 focus:ring-1 focus:ring-primary focus:border-primary outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Phone Number</label>
                        <input type="tel" value="(555) 123-4567" class="w-full bg-white border border-gray-300 rounded-lg py-2.5 px-3 text-gray-900 placeholder-gray-400 focus:ring-1 focus:ring-primary focus:border-primary outline-none text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Primary Specializations</label>
                        <input type="text" value="HVAC, Electrical, Plumbing" class="w-full bg-white border border-gray-300 rounded-lg py-2.5 px-3 text-gray-900 placeholder-gray-400 focus:ring-1 focus:ring-primary focus:border-primary outline-none text-sm">
                        <p class="text-xs text-gray-500 mt-1">Separate specializations with commas.</p>
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="button" class="bg-primary text-white hover:bg-red-800 font-bold py-2.5 px-8 rounded-lg transition-colors soft-elevation">
                        Save Changes
                    </button>
                </div>
            </form>

        </div>
    </main>

    <script src="src/components/sidebar.js" type="module"></script>
    <script src="src/router.js" type="module"></script>
</body>
</html>
